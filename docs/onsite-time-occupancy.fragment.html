<div id="onsite-time-occupancy">
  <h3>同一个交叉区，不同的通过时刻</h3>
  <div class="viz-controls" role="group" aria-label="选择教学候选">
    <button type="button" class="btn" data-choice="fast" aria-pressed="false">加速候选</button>
    <button type="button" class="btn" data-choice="cruise" aria-pressed="true">匀速候选</button>
    <button type="button" class="btn" data-choice="slow" aria-pressed="false">减速候选</button>
  </div>
  <svg class="occupancy-figure" role="img" aria-labelledby="occupancy-title occupancy-desc">
    <title id="occupancy-title">自车和周车在交叉区的占用时间</title>
    <desc id="occupancy-desc">教学假设。周车在2.4至3.2秒占据交叉区；不同自车候选会改变自车占用时间。</desc>
  </svg>
  <div class="text-small tabular-nums" data-detail aria-live="polite"></div>
</div>
<style>
  #onsite-time-occupancy .occupancy-figure { display: block; width: 100%; }
  #onsite-time-occupancy .occupancy-figure text { fill: var(--foreground); font-size: 12px; }
  #onsite-time-occupancy .occupancy-figure .structure { stroke: var(--border); stroke-width: 1; fill: none; }
  #onsite-time-occupancy .occupancy-figure .ego-mark { fill: var(--viz-series-1); }
  #onsite-time-occupancy .occupancy-figure .actor-mark { fill: var(--viz-series-2); }
  #onsite-time-occupancy .occupancy-figure .overlap-mark { fill: var(--foreground); opacity: 0.08; }
</style>
<script>
(() => {
  const root = document.getElementById('onsite-time-occupancy');
  const svg = root.querySelector('.occupancy-figure');
  const detail = root.querySelector('[data-detail]');
  const buttons = Array.from(root.querySelectorAll('[data-choice]'));
  const choices = {
    fast: { name: '加速候选', interval: [1.4, 2.0] },
    cruise: { name: '匀速候选', interval: [2.7, 3.4] },
    slow: { name: '减速候选', interval: [4.5, 5.2] }
  };
  const actor = [2.4, 3.2];
  let selected = 'cruise';
  function restore(saved) {
    const choice = saved && saved.modelContent && saved.modelContent.choice;
    if (Object.prototype.hasOwnProperty.call(choices, choice)) selected = choice;
  }
  restore(window.openai && window.openai.widgetState);
  function draw() {
    const width = Math.max(280, root.getBoundingClientRect().width);
    const left = 76, right = width - 16, top = 32, bottom = 151;
    const x = t => left + t / 6 * (right - left);
    const current = choices[selected];
    const start = Math.max(actor[0], current.interval[0]);
    const end = Math.min(actor[1], current.interval[1]);
    const overlap = Math.max(0, end - start);
    const band = overlap > 0 ? `<rect class="overlap-mark" x="${x(start)}" y="${top}" width="${x(end)-x(start)}" height="${bottom-top}"/>` : '';
    const rows = [
      { name: '周车占用', interval: actor, y: 65, cls: 'actor-mark' },
      { name: '自车占用', interval: current.interval, y: 121, cls: 'ego-mark' }
    ];
    const marks = rows.map(row => {
      const center = x((row.interval[0]+row.interval[1])/2);
      return `<text x="0" y="${row.y+4}">${row.name}</text>
        <line class="structure" x1="${left}" y1="${row.y}" x2="${right}" y2="${row.y}"/>
        <rect class="${row.cls}" x="${x(row.interval[0])}" y="${row.y-8}" width="${x(row.interval[1])-x(row.interval[0])}" height="16"/>
        <text x="${center}" y="${row.y-17}" text-anchor="middle">${row.interval[0].toFixed(1)}–${row.interval[1].toFixed(1)} s</text>`;
    }).join('');
    const ticks = [0, 2, 4, 6].map(t => `<line class="structure" x1="${x(t)}" y1="${bottom}" x2="${x(t)}" y2="${bottom+5}"/><text x="${x(t)}" y="${bottom+20}" text-anchor="${t===0?'start':t===6?'end':'middle'}">${t}</text>`).join('');
    svg.setAttribute('viewBox', `0 0 ${width} 205`);
    svg.setAttribute('height', '205');
    svg.innerHTML = `<title id="occupancy-title">${current.name}的交叉区占用</title>
      <desc id="occupancy-desc">教学假设。周车占用2.4至3.2秒。自车占用${current.interval[0]}至${current.interval[1]}秒。重叠${overlap.toFixed(1)}秒。</desc>
      ${band}${marks}<line class="structure" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"/>${ticks}
      <text class="axis-title" data-axis="x" x="${(left+right)/2}" y="199" text-anchor="middle">从当前帧起的时间（秒）</text>`;
    detail.textContent = `${current.name} · 交叉区占用重叠 ${overlap.toFixed(1)} 秒 · 教学假设`;
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === selected)));
  }
  buttons.forEach(button => button.addEventListener('click', () => {
    selected = button.dataset.choice;
    draw();
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { topic: 'OnSite时空占用教学', choice: selected, example: 'synthetic' },
        privateContent: null
      }).catch(() => {});
    }
  }));
  window.addEventListener('openai:set_globals', event => {
    restore(event.detail && event.detail.globals && event.detail.globals.widgetState);
    draw();
  });
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
